name: Catalog link review
on:
  workflow_dispatch:
  schedule:
    - cron: '30 3 * * 1'
permissions:
  contents: read
jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check:links
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalog-links
          path: reports/catalog-links.json
